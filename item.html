<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>priority page</title>
    <link rel="stylesheet" href="listitemstyle.css">
</head>
<body>
    <div id="flex">
        <header>Placeholder name</header>
        <section class="sidebar">
            <button class="button" id="openmodal">
                Add item
                <svg class="icon" viewBox="0 0 24 24" fill="currentColor">
                    <path
                    fill-rule="evenodd"
                    d="M12 2.25c-5.385 0-9.75 4.365-9.75 9.75s4.365 9.75 9.75 9.75 9.75-4.365 9.75-9.75S17.385 2.25 12 2.25zm4.28 10.28a.75.75 0 000-1.06l-3-3a.75.75 0 10-1.06 1.06l1.72 1.72H8.25a.75.75 0 000 1.5h5.69l-1.72 1.72a.75.75 0 101.06 1.06l3-3z"
                    clip-rule="evenodd"
                    ></path>
                </svg>
            </button>
            <div class="quote-area">
                <img src="pics/pexels-thirdman-5981507.jpg" alt="">
            </div>
            <div class="btns-sect">
                <button class="btn"><a href="index.html">home</a></button>
                <button class="btn"><a href="archive.html"></a>Archive</button>
            </div>
            

        </section>
        <main></main>
        <footer>@ZlaIvaDev '26</footer>
    </div>

    <div class="modal-container hide">
        <div class="modal">
            <h1 class="modal-title">add item to your ToDoList</h1>

            <div class="topsection">
                <h3>Choose priority</h3>
                <div class="dropdown">
                    <div class="select">
                        <span class="selected">Low</span>
                        <div class="caret"></div>
                    </div>

                    <ul class="menu">
                        <li>High</li>
                        <li>Medium</li>
                        <li class="active">Low</li>
                        <li>Completed</li>
                    </ul>
                </div>


                <label for="input-data"><h3>Task:</h3></label>
                <input type="text" name="input-data" id="input-data">
            </div>
            <div class="midsection">
                /* date + label */
                /* time + label */
            </div>

            <div class="notesarea">
                <h3>Add notes</h3>
                <textarea name="notes" id="notes"></textarea>
                <div class="modalbtns">
                    <button id="submit-item">submit</button>
                    <button id="cancel">cancel</button>
                </div>
                
            </div>
        </div>
    </div>
    
    
    <script src="listitemjs.js"></script>
</body>
</html>
