<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="flex">
        <header>
            <div class="title-area">
                <h1>ToDo List</h1>
                <h4>~track your progress~</h4>
            </div>
            <div class="btns-area">
                <button class="hbtn">login</button>
                <button class="hbtn">sign up</button>
            </div>
        </header>

        <main class="cards">
            <section class="card">
                <p class="Completed">Completed</p>
                <div class="card-area">
                </div>
                
            </section>
            <section class="card">
                <p class="Low">Low priority</p>
                <div class="card-area"></div>
            </section>
            <section class="card">
                <p class="Medium">Medium priority</p>
                <div class="card-area"></div>
            </section>
            <section class="card">
                <p class="High">High priority</p>
                <div class="card-area"></div>
            </section>
        </main>

        <footer>all rights reserved @VanZee, OdinProject '26</footer>
    </div>



    <script src="javascript.js"></script>
</body>
</html>
