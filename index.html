<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="flex">
        <header>
            <div class="title-area">
                <h1>ToDo List</h1>
                <h4>~track your progress~</h4>
            </div>
            <div class="btns-area">
                <button class="btn">login</button>
                <button class="btn">sign up</button>
            </div>
        </header>

        <main class="cards">
            <section class="card Completed">
                <p>Completed</p>
                <div class="card-area"></div>
            </section>
            <section class="card Low">
                <p>Low priority</p>
                <div class="card-area"></div>
            </section>
            <section class="card Medium">
                <p>Medium priority</p>
                <div class="card-area"></div>
            </section>
            <section class="card High">
                <p>High priority</p>
                <div class="card-area"></div>
            </section>
        </main>

        <footer>all rights reserved @VanZee, OdinProject '26</footer>
    </div>



    <script src="javascript.js"></script>
</body>
</html>
